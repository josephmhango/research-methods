project:
  type: website
  output-dir: docs
  post-render:
    - node scripts/fix-docs-index-links.mjs
  resources:
    - HAU-logo.svg
    - pics/Laptop_duck.png
    - pics/mean_mark_boxplot_ggplot2.png
    - week7-statistical-inference-tutorial.ipynb
    - data/titanic_passengers.csv

filters:
  - reflection-pauses.lua

website:
  favicon: "img/rmgis.png"
  title: "C5025HF Research methods and Geographical Information Systems"
  sidebar:
    logo: "img/rmgis.png"
    style: "docked"
    search: true
    contents:
      - section: "Week 1: Introduction"
        contents:
          - week1-literature-review.qmd
          - week1-literature-review-guide.qmd
      - section: "Week 3: Research and Statistics"
        contents:
          - week3-scientific-method.qmd
          - week3-descriptive-statistics.qmd
      - section: "Week 4: Introduction to R"
        contents:
          - week5-data-foundations.qmd
          - week5-data-structures.qmd
          - week5-data-manipulation.qmd
          - syntax-basics.qmd
          - indexing.qmd
          - tidy-data.qmd
      - section: "Week 7: Statistical Tests"
        contents:
          - week7-hypothesis-testing-foundations.qmd
          - week7-statistical-inference-tutorial.qmd
          - text: "Colab tutorial"
            href: https://colab.research.google.com/drive/1T5GEaGs3IuPMRjJZp-lTrQgyNS2STxAb?usp=sharing
          # - eda.qmd
          # - t-test.qmd
          # - chisquare.qmd
          # - correlation.qmd
      - section: "Week 8: ANOVA and Non-parametric Tests"
        contents:
          - fisher.qmd
          - anova.qmd
          - 1-way-anova.qmd
          - nonparam.qmd
      - section: "Week 11: Sampling"
        contents:
          - week11-sampling-theory.qmd
          - week11-spatial-sampling.qmd
      - section: "Week 12: Regression"
        contents:
          - week12-regression.qmd
          - regression_tutorial.qmd
      - section: "Week 13: Communicating Research"
        contents:
          - reporting.qmd
          - vistut.qmd
          - week13-analysis-plan.qmd
          - week13-effective-graphics.qmd
          - week13-data-visualisation.qmd
format:
  html:
    highlight-style: a11y
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true

editor: visual

